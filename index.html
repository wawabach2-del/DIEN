<style>
/* Layout: phone-first app. Black logo band on top, soft blush canvas, floating pill tab bar, rounded cards with photo thumbnails. Palette: rose + champagne gold taken from the Dien logo. */
:root{
  --bg:#FAF4F2; --surface:#FFFFFF; --fg:#2A1B23; --muted:#85707A; --line:#F0E4E4;
  --accent:#C45C7E; --accent-soft:#FBE8EE; --on-accent:#FFFFFF;
  --gold:#A7773A; --gold-soft:#F7EBD8; --ok:#2F7D5B; --bad:#B23A48; --bad-soft:#FDE4E6;
  --ink:#0A0709; --ink-fg:#E6C58A; --ink-mute:#B9A27C; --ink-line:#4A3B26;
  --shadow:0 10px 30px rgba(196,92,126,.25);
  --display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="white"]){
  --bg:#171014; --surface:#241A20; --fg:#F6E9EE; --muted:#BFA3AF; --line:#38282F;
  --accent:#F08DAE; --accent-soft:#41242F; --on-accent:#2B0F1B;
  --gold:#E3BE80; --gold-soft:#3B2D1B; --ok:#6FD3A6; --bad:#F59AA5; --bad-soft:#4B2229;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171014; --surface:#241A20; --fg:#F6E9EE; --muted:#BFA3AF; --line:#38282F;
  --accent:#F08DAE; --accent-soft:#41242F; --on-accent:#2B0F1B;
  --gold:#E3BE80; --gold-soft:#3B2D1B; --ok:#6FD3A6; --bad:#F59AA5; --bad-soft:#4B2229;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

:root[data-theme="white"]{--bg:#FFFFFF;--line:#EFE6EA;--accent-soft:#FBEBF1;--gold-soft:#FAF1E4;color-scheme:light}
:root[data-theme="white"] body{background-image:none}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 180px}
.wrap{max-width:760px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 0 12px}
.brand{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:.02em;margin:0}
.brand i{font-weight:500;color:var(--accent)}
.sub{color:var(--muted);font-size:13px}

h2{font-family:var(--display);font-size:20px;margin:20px 0 8px;font-weight:600;text-wrap:balance}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:0;width:100%;padding:11px 14px;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--accent-soft);padding:4px;border-radius:12px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;background:transparent;padding:8px 4px;border-radius:9px;font-size:13px;line-height:1.2;color:var(--muted)}
.seg button b{display:block;font-size:15px;color:inherit}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 4px rgba(194,84,126,.25)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .meta{color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.old{text-decoration:line-through;color:var(--muted);font-size:12px}
.price{color:var(--accent);font-weight:600}
.badge{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.low{background:var(--gold-soft);color:var(--gold)}
.badge.out{background:var(--bad-soft);color:var(--bad)}
.step{display:flex;align-items:center;gap:2px}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.step button.plus{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step .q{min-width:30px;text-align:center;font-weight:700}
.step input{width:56px;height:36px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.gold{background:var(--gold-soft);border-color:transparent;color:var(--gold)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile small{color:var(--muted);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.tile strong{font-family:var(--display);font-size:22px}
.tile.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile.main small{color:inherit;opacity:.85}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:170px}
thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--accent-soft)}
tr.cat td{background:var(--gold-soft);color:var(--gold);font-weight:700;text-align:left;font-size:13px;letter-spacing:.04em;text-transform:uppercase}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.card .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card ul{margin:6px 0 8px;padding-left:18px;color:var(--muted);font-size:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form label.full{grid-column:1/-1}
.form input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
.form .row{grid-column:1/-1}
.editrow{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0}
.editrow label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.editrow label.full{grid-column:1/-1}
.editrow input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}
.editrow .row{grid-column:1/-1}
textarea.box{width:100%;min-height:120px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:12px}
.note{color:var(--muted);font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.warn{color:var(--gold);font-size:13px;margin-top:4px}
.seg.sm button{padding:6px 2px;font-size:12px}
.seg.sm button b{font-size:13px}
.ghead{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.gl{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.gl select,.gl input[type=number],.ghead input.gname{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.gl .rt{display:flex;flex-direction:column;gap:6px;text-align:right}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{border:0;background:transparent;padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

.cartbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(56px + env(safe-area-inset-bottom,0px));
  padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.cartbar button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:760px;margin:0 auto;
  border:0;background:var(--accent);color:var(--on-accent);padding:13px 16px;border-radius:14px;font-weight:700;box-shadow:var(--shadow)}
.sheetbg{position:fixed;top:0;left:0;right:0;bottom:0;inset:0;background:rgba(52,18,34,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0;font-family:var(--display);font-size:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:999px;z-index:40;font-weight:600;max-width:90%;text-align:center}
@media (max-width:420px){.form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}

/* tampilan modern */
body{background-color:var(--bg);background-image:radial-gradient(80% 30% at 100% 0,var(--accent-soft),transparent 70%);background-repeat:no-repeat;letter-spacing:-.005em}
h2{font-weight:800;font-size:19px;letter-spacing:-.02em}
header{display:block;padding:14px 0 6px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);border-radius:24px;padding:14px 16px 14px 18px;box-shadow:0 12px 30px rgba(10,7,9,.28)}
.logo{display:block;flex:none}
.logo img{display:block;height:36px;width:auto;max-width:none;object-fit:contain;mix-blend-mode:screen}
.tg.ic{padding:0;width:34px;height:34px;justify-content:center}
.tg.ic svg{width:17px;height:17px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.hero .sub{color:var(--ink-mute);font-size:12px;font-weight:500}
.tg{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--ink-line);color:var(--ink-fg);font-size:12px;font-weight:700;text-decoration:none}
.tg svg{width:14px;height:14px}
.th{width:56px;height:70px;border-radius:16px;object-fit:contain;background:#fff;border:1px solid var(--line);display:block}
.th.ph{display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--gold-soft))}
.thl{position:relative;display:block;cursor:pointer;border-radius:16px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.thl:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fi{position:absolute;top:0;left:0;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.thl .cam{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:16px;line-height:22px;text-align:center;font-weight:700;pointer-events:none;border:2px solid var(--surface)}
.lt{display:flex;align-items:center;gap:10px;min-width:0}
.lt .th{width:42px;height:54px;border-radius:12px;font-size:18px}
.bcard{display:flex;align-items:center;gap:14px;margin:12px 0}
.list,.card,.tile,.scroll,.form{border-radius:24px;border:0;box-shadow:0 1px 2px rgba(42,27,35,.05),0 12px 32px rgba(42,27,35,.07)}
.item{padding:12px 14px;gap:4px 14px}
.item .name{font-weight:700;letter-spacing:-.01em}
.price{color:var(--accent);font-weight:800;font-size:15px}
.seg{border-radius:20px;padding:5px}.seg button{border-radius:16px;font-weight:600}
.search{border-radius:999px;padding:13px 20px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(42,27,35,.04)}
.btn{border-radius:999px;font-weight:700}
.btn.primary{box-shadow:var(--shadow)}
.chip,.badge{border-radius:999px}
.chip{padding:8px 14px;font-weight:600}
.chip[aria-pressed="true"]{box-shadow:var(--shadow)}
.step button,.step input{border-radius:50%}
.step input{border-radius:14px}
.step button{width:40px;height:40px}
.step button.plus{box-shadow:var(--shadow)}
.sheet{border-radius:28px 28px 0 0}
.tile.main{background:linear-gradient(135deg,var(--accent),#E58AAB);color:var(--on-accent)}
.tile strong{font-weight:800}
.form input,.editrow input,.gl select,.gl input[type=number],.ghead input.gname{border-radius:14px}
.editrow input[type=file],.form input[type=file]{padding:8px;font-size:13px}
thead th{background:var(--accent-soft);color:var(--accent)}
.cartbar{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.cartbar button{border-radius:999px;padding:15px 22px;box-shadow:var(--shadow)}
.toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
nav{left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100% - 24px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--line);border-radius:28px;box-shadow:0 14px 40px rgba(42,27,35,.18)}
nav .in{max-width:none;gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:22px;padding:8px 4px 7px;font-size:11.5px;font-weight:600}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.pastewrap{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.pastebox{padding:14px;border:1.5px dashed var(--accent);border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;min-height:46px;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;margin:2px 0 4px;overflow-wrap:anywhere}
.desc.open{display:block;-webkit-line-clamp:unset}
.editrow textarea,.form textarea{padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);min-width:0;width:100%;resize:vertical;font:inherit;color:var(--fg)}
.thbtn{border:0;background:none;padding:0;border-radius:16px;cursor:pointer;display:block}
.lnk{border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.dimg{width:100%;height:260px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:20px;display:block;margin-top:12px}
.dimg.dph{display:grid;place-items:center;font-size:64px;font-weight:800;color:var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--gold-soft))}
.dtext{font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
input,select,textarea{font-size:16px}
.seg.four{grid-template-columns:repeat(4,1fr)}

.seg.three{display:grid;grid-template-columns:repeat(3,1fr)}
.rl{margin:8px 0 12px;padding-left:22px;font-size:14px;line-height:1.5}.rl li{margin:7px 0}
.rulescard{margin:12px 0}
/* motion perpindahan halaman */
@media (prefers-reduced-motion:no-preference){
#main.enter-r{animation:apInR .36s cubic-bezier(.2,.8,.2,1)}
#main.enter-l{animation:apInL .36s cubic-bezier(.2,.8,.2,1)}
#main.enter-u{animation:apInU .36s cubic-bezier(.2,.8,.2,1)}
.rise{animation:apRise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*32ms)}
#sheet.fresh .sheetbg{animation:apFade .24s ease-out}
#sheet.fresh .sheet{animation:apSheet .36s cubic-bezier(.2,.8,.2,1)}
}
@keyframes apInR{from{opacity:0;transform:translateX(32px)}}
@keyframes apInL{from{opacity:0;transform:translateX(-32px)}}
@keyframes apInU{from{opacity:0;transform:translateY(16px)}}
@keyframes apRise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes apFade{from{opacity:0}}
@keyframes apSheet{from{opacity:.4;transform:translateY(70px)}}
.socrow .btn svg{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
/* iOS: cegah halaman ter-zoom saat mengetik */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
input:not([type=file]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}
/* varian, ukuran, galeri foto, bagikan */
.dt.sel{position:relative;width:64px;height:64px;opacity:.55}
.dt.sel.on{opacity:1}
.dt .ck{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;border:1.5px solid var(--line);color:transparent;font-size:12px;line-height:17px;text-align:center;font-weight:700}
.dt.on .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.vt{font-size:12.5px;color:var(--gold);font-weight:600;margin:1px 0 2px}
td .vt{display:block}
.badge.vb{background:var(--gold-soft);color:var(--gold)}
.badge.sb{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.two{display:flex;gap:6px}.two input{flex:1;min-width:0}
.form select,.editrow select,.sharebox select{padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);font:inherit;min-width:0}
.two select{width:78px;flex:none}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
.slot{position:relative;min-height:92px;aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}
.slot img{width:100%;height:100%;object-fit:contain;display:block}
.slot.add{border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.slot.add span{font-size:26px;line-height:1;font-weight:600}
.slot small{font-size:11px;color:var(--muted)}.slot.add small{color:var(--accent);font-weight:600}

var CATS=Object.keys(SEED);

function seed(){
  var n=0,products=[];
  CATS.forEach(function(c){SEED[c].forEach(function(p){n++;products.push({id:'p'+n,name:p[0],cat:c,price:p[1],stock:20});});});
  return {n:n,products:products,tx:[]};
}

function pad(n){return n<10?'0'+n:''+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function nowTime(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}

}

  function fallback(){var b=$(boxId||'exportbox');if(b){b.innerHTML='<p class="note">Salin manual teks di bawah ini, lalu simpan atau tempel di tujuannya.</p><textarea class="box" id="expta" readonly></textarea>';var ta=$('expta');ta.value=text;ta.focus();ta.select();}else toast('Gagal menyalin');}

var IMK='dien-img-v1';
var imgs=loadImgs();
function loadImgs(){try{var r=localStorage.getItem(IMK);if(r){var s=JSON.parse(r);if(s&&s.p){s.m=s.m||{};return s;}}}catch(e){}return {logo:'',p:{},m:{}};}
/* ---- penyimpanan foto di memori HP (IndexedDB). localStorage hanya cadangan bila IndexedDB tidak ada ---- */
var DB=null,dirty={},storTxt='';
function openDB(cb){
  try{var r=indexedDB.open('dien-db',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('imgs');};
    r.onsuccess=function(){DB=r.result;cb(true);};
    r.onerror=function(){cb(false);};r.onblocked=function(){cb(false);};
  }catch(e){cb(false);}
}
function idbPut(id,arr,done){
  try{var t=DB.transaction('imgs','readwrite'),st=t.objectStore('imgs');
    if(arr)st.put(arr,id);else st.delete(id);
    t.oncomplete=function(){done(true);};t.onerror=t.onabort=function(){done(false);};
  }catch(e){done(false);}
}
function flushDirty(done){
  var ids=Object.keys(dirty);dirty={};
  if(!ids.length){if(done)done(true);return;}
  if(!DB){try{localStorage.setItem(IMK,JSON.stringify(imgs));if(done)done(true);}catch(e){if(done)done(false);}return;}
  var left=ids.length,ok=true;
  ids.forEach(function(id){idbPut(id,imgs.m[id],function(r){if(!r)ok=false;if(--left===0&&done)done(ok);});});
}
function idbLoadAll(done){
  var keys={};
  try{var t=DB.transaction('imgs','readonly'),rq=t.objectStore('imgs').openCursor();
    rq.onsuccess=function(){var c=rq.result;if(c){imgs.m[c.key]=c.value;keys[c.key]=1;c.continue();}else done(keys);};
    rq.onerror=function(){done(keys);};
  }catch(e){done(keys);}
}
function fmtMB(n){return n>=1073741824?(n/1073741824).toFixed(1)+' GB':Math.max(0.1,n/1048576).toFixed(n>=10485760?0:1)+' MB';}
function updateStorage(){
  try{
    if(!navigator.storage||!navigator.storage.estimate)return;
    navigator.storage.estimate().then(function(e){
      var go=function(per){
        storTxt='Foto disimpan di memori HP ini · terpakai '+fmtMB(e.usage||0)+' dari sekitar '+fmtMB(e.quota||0)+' tersedia'+(per?' · penyimpanan permanen aktif':'');
        var el=$('stor');if(el)el.textContent=storTxt;
      };
      if(navigator.storage.persisted)navigator.storage.persisted().then(go,function(){go(false);});else go(false);
    });
  }catch(e){}
}
function askPersist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(updateStorage);}catch(e){}}
function startPhotoStore(){
  openDB(function(ok){
    if(!ok)return;
    idbLoadAll(function(keys){
      Object.keys(imgs.p||{}).forEach(function(id){if(!imgs.m[id]){imgs.m[id]=[imgs.p[id]];}});
      Object.keys(imgs.m).forEach(function(id){if(!keys[id])dirty[id]=1;});
      flushDirty(function(done){
        if(done){imgs.p={};try{localStorage.removeItem(IMK);}catch(e){}}
        askPersist();updateStorage();render();
      });
    });
  });
}
function saveImgs(){flushDirty(function(ok){if(!ok)toast('Memori HP penuh. Hapus beberapa foto dulu.');});return true;}
function resizeFile(file,max,type,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){var r=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*r)),h=Math.max(1,Math.round(im.height*r));
      var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
      if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,w,h);}
      x.drawImage(im,0,0,w,h);cb(c.toDataURL(type,0.82));};
    im.onerror=function(){toast('File itu bukan gambar');};im.src=fr.result;};
  fr.onerror=function(){toast('Gagal membaca file');};fr.readAsDataURL(file);
}

var MAXPH=3;
function gallery(p){var m=imgs.m&&imgs.m[p.id];if(m)return m.slice(0,MAXPH);var u=imgs.p[p.id]||BUILT[p.name];return u?[u]:[];}
function setGallery(id,arr){imgs.m=imgs.m||{};imgs.m[id]=arr.slice(0,MAXPH);delete imgs.p[id];dirty[id]=1;}
function sizeTxt(p){return p.size?(String(p.size).replace('.',',')+' '+(p.unit||'ml')):'';}
function vtxt(p){return [p.variant||'',sizeTxt(p)].filter(Boolean).join(' · ');}
function nameV(p){return p.name+(p.variant?' ('+p.variant+')':'');}
function fullName(p){var n=nameV(p),z=sizeTxt(p);if(z){var re=new RegExp(String(p.size).replace('.','[.,]')+'\\s*'+(p.unit||'ml'),'i');if(!re.test(p.name))n+=' '+z;}return n;}
function slotsHtml(id,arr){
  var h='<div class="slots">';
  for(var i=0;i<MAXPH;i++){
    if(arr[i])h+='<div class="slot"><img src="'+arr[i]+'" alt="Foto '+(i+1)+'"><button type="button" class="sx" data-act="pslotdel" data-id="'+id+'" data-i="'+i+'" aria-label="Hapus foto '+(i+1)+'">×</button></div>';
    else if(i===arr.length)h+='<label class="slot add" aria-label="Tambah foto '+(i+1)+'"><span>+</span><small>Foto '+(i+1)+'</small><input class="fi" type="file" accept="image/*" data-act="pslot" data-id="'+id+'" data-i="'+i+'"></label>';
    else h+='<div class="slot empty"><small>Foto '+(i+1)+'</small></div>';
  }
  return h+'</div>';
}
function refreshSlots(id){var arr=id==='new'?(ui.newImgs||[]):gallery(prod(id)||{id:id,name:''});var b=$(id==='new'?'nslots':'eslots'+id);if(b)b.innerHTML=slotsHtml(id,arr);}
function addPhoto(id,u){
  if(id==='new'){ui.newImgs=ui.newImgs||[];if(ui.newImgs.length>=MAXPH){toast('Maksimal 3 foto');return;}ui.newImgs.push(u);refreshSlots('new');toast('Foto dipilih');return;}
  var p=prod(id);if(!p)return;var arr=gallery(p).slice();
  if(arr.length>=MAXPH){toast('Maksimal 3 foto');return;}
  arr.push(u);setGallery(id,arr);persist('Foto tersimpan');refreshSlots(id);
}
function shareText(p,tk){var t='*'+fullName(p)+'*';if(tk)t+='\nHarga: '+rp(tp(p.price,TIERS[tk].d));if(p.desc)t+='\n\n'+p.desc;return t;}
function dataToFile(u,name){var a=u.split(','),m=(a[0].match(/:(.*?);/)||[])[1]||'image/jpeg',b=atob(a[1]),n=b.length,u8=new Uint8Array(n);while(n--)u8[n]=b.charCodeAt(n);return new File([u8],name,{type:m});}
function slug(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'produk';}
function saveLinks(p,g,idx){
  return '<div class="row" style="margin-top:6px">'+g.map(function(u,i){return '<a class="btn sm" download="'+slug(p.name)+'-'+((idx||[0])[i]+1)+'.jpg" href="'+u+'" style="text-decoration:none">Simpan foto '+((idx||[0])[i]+1)+'</a>';}).join('')+'</div>';
}
function shareInfo(msg,p,g,idx,text){
  var b=$('dbox');if(!b)return;
  b.innerHTML='<p class="note" style="margin:8px 0 4px">'+msg+'</p>'+(g.length?saveLinks(p,g,idx):'')+
    '<div class="row" style="margin-top:6px"><button class="btn sm" type="button" data-act="dwatext">Kirim teks saja ke WhatsApp</button></div>';
  ui.lastShareText=text;
}
function shareProduct(p,tk,idx){
  var all=gallery(p),g=(idx||[0]).map(function(i){return all[i];}).filter(Boolean),text=shareText(p,tk),files=[];
  try{files=g.map(function(u,i){return dataToFile(u,slug(p.name)+'-'+((idx||[0])[i]+1)+'.jpg');});}catch(e){files=[];}
  var box=$('dbox');if(box)box.innerHTML='';
  if(!navigator.share){shareInfo('Browser ini belum punya tombol bagikan. Simpan foto di bawah, lalu lampirkan di WhatsApp. Atau buka aplikasi lewat Chrome.',p,g,idx,text);return;}
  var can=true;
  if(files.length){try{can=!navigator.canShare||navigator.canShare({files:files});}catch(e){can=false;}}
  if(!can){shareInfo('Browser ini belum bisa mengirim foto langsung. Simpan foto di bawah, lalu lampirkan di WhatsApp. Atau buka aplikasi lewat Chrome.',p,g,idx,text);return;}
  var d1={text:text};if(files.length)d1.files=files;
  navigator.share(d1).catch(function(e){
    if(e&&e.name==='AbortError')return;
    if(!files.length){shareInfo('Gagal membagikan ('+((e&&e.name)||'error')+').',p,g,idx,text);return;}
    navigator.share({files:files}).then(function(){copy(text,'Foto terkirim. Teks info disalin, tempel di chat WhatsApp.','dbox');}).catch(function(e2){
      if(e2&&e2.name==='AbortError')return;
      shareInfo('Foto belum bisa dikirim langsung ('+((e2&&e2.name)||(e&&e.name)||'error')+'). Simpan foto di bawah, lalu lampirkan di WhatsApp.',p,g,idx,text);
    });
  });
}

var SK='dien-snd',sndOn=true;try{sndOn=localStorage.getItem(SK)!=='0';}catch(e){}
var sctxo=null;
function sctx(){try{if(!sctxo){var AC=window.AudioContext||window.webkitAudioContext;if(AC)sctxo=new AC();}if(sctxo&&sctxo.state==='suspended')sctxo.resume();}catch(e){}return sctxo;}
function blip(c,f,t,d,v){
  var o=c.createOscillator(),g=c.createGain(),o2=c.createOscillator(),g2=c.createGain();
  o.type='sine';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=0.22;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(c.destination);
  o.start(t);o2.start(t);o.stop(t+d+0.05);o2.stop(t+d+0.05);
}
function sfx(kind,n){
  if(!sndOn)return;var c=sctx();if(!c)return;var t=c.currentTime+0.01,V=0.11;
  if(kind==='tab'){var b=[784,880,988,1109][n||0]||880;blip(c,b,t,0.14,V);blip(c,b*1.5,t+0.07,0.24,V*0.8);}
  else if(kind==='open'){blip(c,659,t,0.12,V);blip(c,880,t+0.06,0.12,V);blip(c,1318,t+0.12,0.26,V);}
  else if(kind==='close'){blip(c,1175,t,0.12,V);blip(c,784,t+0.07,0.22,V);}
  else if(kind==='ok'){blip(c,784,t,0.1,V);blip(c,988,t+0.08,0.1,V);blip(c,1318,t+0.16,0.32,V);}
}

function shareSocial(p,tk,idx,k){
  var S=SOCIAL[k],all=gallery(p),g=(idx||[0]).map(function(i){return all[i];}).filter(Boolean),text=socialText(p,tk),files=[];
  try{files=g.map(function(u,i){return dataToFile(u,slug(p.name)+'-'+((idx||[0])[i]+1)+'.jpg');});}catch(e){files=[];}

  var can=true;if(files.length){try{can=!navigator.canShare||navigator.canShare({files:files});}catch(e){can=false;}}

  navigator.share(d).catch(function(e){if(e&&e.name==='AbortError')return;fallback('Belum bisa dibagikan ('+((e&&e.name)||'error')+'). Caption sudah disalin. Simpan foto, lalu buat postingan di '+S.n+'.');});
}

function cartLines(){
  var d=TIERS[ui.tier].d;
  return Object.keys(ui.cart).map(function(id){var p=prod(id);if(!p)return null;var q=ui.cart[id];return {p:p,q:q,price:tp(p.price,d)};}).filter(Boolean);
}
function cartTotal(){return cartLines().reduce(function(s,l){return s+l.price*l.q;},0);}

function waMsg(items,total,customer,tierKey){
  var t=TIERS[tierKey],m='*Pesanan Dien*\n';
  if(customer)m+='Atas nama: '+customer+'\n';
  m+='Tipe: '+t.label+(t.d?' (diskon '+t.d+'%)':'')+'\n\n';
  items.forEach(function(i,n){m+=(n+1)+'. '+i.name+' × '+i.qty+' @ '+rp(i.price)+' = '+rp(i.price*i.qty)+'\n';});
  m+='\n*Total: '+rp(total)+'*\n';
  if(state.pay&&state.pay.trim())m+='\nPembayaran ke:\n'+state.pay.trim()+'\n';
  m+='\nMohon kirim bukti transfer setelah pembayaran. Terima kasih 🙏';
  return m;
}
function waLink(text,phone){
  var d=String(phone||'').replace(/\D/g,'');

}

function saveTx(){
  var L=cartLines();if(!L.length)return;
  var d=TIERS[ui.tier].d,now=new Date();
  var tx={id:'T'+now.getTime(),date:today(),time:nowTime(),customer:ui.customer.trim(),tier:ui.tier,disc:d,
    items:L.map(function(l){return {pid:l.p.id,name:nameV(l.p),cat:l.p.cat,qty:l.q,normal:l.p.price,price:l.price};}),total:cartTotal()};
  L.forEach(function(l){l.p.stock-=l.q;});
  state.tx.push(tx);save();
  ui.cart={};ui.customer='';ui.phone='';renderSheet(false);toast('Transaksi tersimpan · '+rp(tx.total));render();

/* ---------- pesan WhatsApp: nama, jumlah, produk ---------- */
var WA_STOP={parfum:1,perfume:1,pf:1,botol:1};
var ALIAS={sampo:'shampo',shampoo:'shampo',deo:'deodorant',thaharah:'taharah'};
var QTY=/^(?:(\d{1,3})(?:x|pcs|pc|buah|btl|botol)?|x(\d{1,3}))$/i;
function qtyOf(tok){var m=QTY.exec(tok);return m?(parseInt(m[1]||m[2],10)||0):0;}
function cleanName(n){return String(n).replace(/^[\s,:\-.]+|[\s,:\-.]+$/g,'').replace(/\s+/g,' ').replace(/\b[a-z]/g,function(c){return c.toUpperCase();});}
function ntok(s){return String(s).toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(Boolean).map(function(w){return ALIAS[w]||w;});}
function lev(a,b){
  var m=a.length,n=b.length,i,j,prev=[],cur;
  for(j=0;j<=n;j++)prev[j]=j;
  for(i=1;i<=m;i++){cur=[i];for(j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));}prev=cur;}
  return prev[n];
}
function tokScore(q,t){
  if(q===t)return 1;
  if(q.length>=3&&t.indexOf(q)===0)return 0.9;
  if(q.length>=5&&Math.abs(q.length-t.length)<=1&&lev(q,t)<=1)return 0.8;
  return 0;
}
function scoreProd(qt,hasTester,p){
  var pt=ntok(p.name),sum=0;
  qt.forEach(function(q){var b=0;pt.forEach(function(t){var s=tokScore(q,t);if(s>b)b=s;});sum+=b;});
  var s=sum/qt.length-0.02*Math.max(0,pt.length-qt.length);
  var isT=p.cat==='Tester 2ml';
  if(isT&&!hasTester)s-=0.5;
  if(!isT&&hasTester)s-=0.5;
  return s;
}
function findProd(text){
  var qt=ntok(text).filter(function(w){return !WA_STOP[w];});
  if(!qt.length)qt=ntok(text);
  if(!qt.length)return {pid:null,cands:[]};
  var vocab={};
  state.products.forEach(function(p){ntok(p.name).forEach(function(t){vocab[t]=1;});});
  for(var i=0;i<qt.length-1;i++){if(vocab[qt[i]+qt[i+1]]){qt.splice(i,2,qt[i]+qt[i+1]);}}
  var hasT=qt.indexOf('tester')>=0;
  var sc=state.products.map(function(p){return {p:p,s:scoreProd(qt,hasT,p)};}).filter(function(x){return x.s>=0.6;}).sort(function(a,b){return b.s-a.s;});
  var top=sc[0],sec=sc[1];
  var ok=top&&top.s>=0.85&&(!sec||top.s-sec.s>=0.1);
  return {pid:ok?top.p.id:null,cands:sc.slice(0,6).map(function(x){return x.p.id;})};
}
function parseWa(text){
  var groups=[],byKey={},bad=[],last='';
  String(text).split(/\r?\n/).forEach(function(raw){
    var line=raw.replace(/^\s*\[[^\]]*\]\s*/,'').replace(/^\s*\d{1,2}\/\d{1,2}\/\d{2,4},?\s*\d{1,2}[.:]\d{2}(?:\s*[ap]m)?\s*-\s*/i,'').trim();
    if(!line)return;
    var cur=null,rest=line,m=/^([^:\d]{2,40}):\s*(.+)$/.exec(line);
    if(m){cur=cleanName(m[1]);rest=m[2];}
    var segs=rest.split(/\s*[,;+]\s*|\s+dan\s+/i).filter(function(s){return s.trim();});
    var items=[];
    segs.forEach(function(seg,si){
      var tk=seg.trim().split(/\s+/),qi=-1,q=0,k;
      for(k=0;k<tk.length;k++){q=qtyOf(tk[k]);if(q){qi=k;break;}}
      if(qi<0){items.push({err:seg.trim()});return;}
      var before=tk.slice(0,qi).join(' '),after=tk.slice(qi+1).join(' '),pname;
      if(!after){pname=before;}
      else if(!before){pname=after;}
      else if(si===0&&cur===null){cur=cleanName(before);pname=after;}
      else{pname=before+' '+after;}
      if(!pname){items.push({err:seg.trim()});return;}
      items.push({q:q,prod:pname});
    });
    var nm=cur!==null?cur:last;
    last=nm;
    items.forEach(function(it){
      if(it.err){bad.push(it.err);return;}
      var key=nm.toLowerCase(),g=byKey[key];
      if(!g){g={name:nm,tier:(state.cust&&state.cust[key])||'umum',lines:[]};byKey[key]=g;groups.push(g);}
      var f=findProd(it.prod);
      g.lines.push({raw:it.prod,q:it.q,pid:f.pid,cands:f.cands});
    });
  });
  return {groups:groups,bad:bad};
}
function waProblems(){
  var gs=(ui.wa&&ui.wa.groups)||[],need={},msg=[],open=0;
  gs.forEach(function(g){g.lines.forEach(function(l){if(l.pid)need[l.pid]=(need[l.pid]||0)+l.q;else open++;});});
  if(open)msg.push(open+' baris belum ada produknya');
  Object.keys(need).forEach(function(id){var p=prod(id);if(p&&need[id]>p.stock)msg.push(p.name+': diminta '+need[id]+', stok '+p.stock);});
  return msg;
}

}

function waSave(){

   case 'edel':
     state.products=state.products.filter(function(x){return x.id!==id;});delete ui.cart[id];save();ui.editing=null;ui.confirm=null;toast('Barang dihapus');render();break;
   case 'detail':ui.detail=id;ui.dph=0;ui.dsel=[0];ui.dtier=undefined;renderDetail();break;
   case 'rulestoggle':ui.rulesOpen=!ui.rulesOpen;ui.animForm=true;render();break;
   case 'rulestab':ui.rule=v;render();break;
   case 'rulecopy':copy(rulesText(ui.rule||'agen'),'Ketentuan disalin. Tempel di WhatsApp.','rbox');break;
   case 'ruletext':shareRule(ui.rule||'agen','text');break;
   case 'ruleimg':shareRule(ui.rule||'agen','img');break;
   case 'dph':if($('stier'))ui.dtier=$('stier').value;ui.dph=+el.dataset.i;renderDetail();break;
   case 'dsel':if($('stier'))ui.dtier=$('stier').value;var si=+el.dataset.i;ui.dsel=ui.dsel||[0];var sk=ui.dsel.indexOf(si);if(sk>=0)ui.dsel.splice(sk,1);else ui.dsel.push(si);ui.dsel.sort();renderDetail();break;
   case 'dwatext':window.open('https://wa.me/?text='+encodeURIComponent(ui.lastShareText||''),'_blank','noopener');break;
   case 'dsoc':var sp3=prod(ui.detail);if(sp3)shareSocial(sp3,($('stier')||{}).value||'',ui.dsel||[0],v);break;
   case 'snd':sndOn=(v==='1');try{localStorage.setItem(SK,sndOn?'1':'0');}catch(e){}if(sndOn)sfx('ok');render();break;
   case 'dshare':var sp=prod(ui.detail);if(sp)shareProduct(sp,($('stier')||{}).value||'',ui.dsel||[0]);break;
   case 'pslotdel':if(id==='new'){(ui.newImgs||[]).splice(+el.dataset.i,1);refreshSlots('new');break;}var sq=prod(id);if(sq){var sa=gallery(sq).slice();sa.splice(+el.dataset.i,1);setGallery(id,sa);persist('Foto dihapus');refreshSlots(id);}break;
   
   case 'dclose':ui.detail=null;renderSheet(false);break;
   case 'dadd':var dp=prod(ui.detail);if(dp){if((ui.cart[dp.id]||0)>=dp.stock){toast('Stok tidak cukup');break;}setQty(dp.id,(ui.cart[dp.id]||0)+1);refresh();renderCartBar();renderDetail();}break;
   case 'dcopy':var dq=prod(ui.detail);if(dq){copy('*'+dq.name+'*\n'+TIER_KEYS.map(function(k){var t=TIERS[k];return t.label+(t.d?' '+t.d+'%':'')+': '+rp(tp(dq.price,t.d));}).join('\n')+(dq.desc?'\n\n'+dq.desc:''),'Info produk disalin','dbox');}break;
   case 'bkcopy':var bfull=JSON.stringify({v:1,state:state,imgs:{p:imgs.p,m:imgs.m}}),bsmall=bfull.length>3500000;copy(bsmall?JSON.stringify({v:1,state:state}):bfull,bsmall?'Cadangan data disalin. Foto tidak ikut (terlalu besar), foto tetap aman di memori HP.':'Cadangan disalin. Simpan di tempat aman.','bkbox');break;
   case 'bkopen':$('bkbox').innerHTML='<textarea class="box" id="bktext" placeholder="Tempel cadangan di sini" style="margin-top:8px"></textarea><div class="row" style="margin-top:8px"><button class="btn danger sm" type="button" data-act="bkrestore">Pulihkan sekarang (data saat ini diganti)</button></div>';break;
   case 'bkrestore':try{var bo=JSON.parse($('bktext').value);if(!bo||!bo.state||!Array.isArray(bo.state.products))throw 0;state=bo.state;state.tx=state.tx||[];save();var hadM=bo.imgs&&(bo.imgs.m||bo.imgs.p);if(hadM){Object.keys(imgs.m||{}).forEach(function(k){dirty[k]=1;});imgs={logo:'',p:(bo.imgs&&bo.imgs.p)||{},m:(bo.imgs&&bo.imgs.m)||{}};Object.keys(imgs.p).forEach(function(k){if(!imgs.m[k])imgs.m[k]=[imgs.p[k]];});imgs.p={};Object.keys(imgs.m).forEach(function(k){dirty[k]=1;});saveImgs();}render();toast('Data dipulihkan');}catch(er){toast('Cadangan tidak valid');}break;
   case 'descx':ui.dopen=ui.dopen===id?null:id;refresh();break;
   case 'theme':try{localStorage.setItem(TK,v);}catch(e){}applyTheme(v);render();break;
   case 'mode':ui.mode=v;render();break;
   case 'pimgdel':delete imgs.p[id];if(imgs.m)delete imgs.m[id];dirty[id]=1;saveImgs();toast('Foto dihapus');refresh();break;
   case 'exp':doExport(v);break;
   case 'txask':ui.confirm='tx'+id;refresh();break;
   case 'txdel':
     var t=state.tx.find(function(x){return x.id===id;});
     if(t){t.items.forEach(function(i){var pp=prod(i.pid);if(pp)pp.stock+=i.qty;});state.tx=state.tx.filter(function(x){return x.id!==id;});save();}
     ui.confirm=null;toast('Transaksi dibatalkan, stok dikembalikan');refresh();break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.type==='file'){handleFile(t);return;}
  if(t.id==='q'){ui.q=t.value;refresh();}
  else if(t.dataset&&t.dataset.soc){state.soc=state.soc||{};state.soc[t.dataset.soc]=t.value.trim();save();renderSocial();}
  else if(t.id==='cust'){ui.customer=t.value;updateWa();}
  else if(t.id==='cphone'){ui.phone=t.value;updateWa();}
  else if(t.id==='payinfo'){state.pay=t.value;save();updateWa();}
  else if(t.id==='watext'){if(ui.wa)ui.wa.text=t.value;}
  else if(t.id==='dayin'){if(t.value){ui.day=t.value;refresh();}}
  else if(t.id==='monin'){if(t.value){ui.month=t.value;refresh();}}
});
document.addEventListener('change',function(e){
  var t=e.target;
  var act=t.dataset&&t.dataset.act;
  if(t.type==='file'){handleFile(t);return;}
  if(act==='sset'){var p=prod(t.dataset.id);if(p){p.stock=Math.max(0,parseInt(t.value,10)||0);save();render();}}
  else if(act==='wap'){var g1=ui.wa.groups[+t.dataset.g];if(g1){g1.lines[+t.dataset.l].pid=t.value||null;renderWa();}}
  else if(act==='waq'){var g2=ui.wa.groups[+t.dataset.g];if(g2){g2.lines[+t.dataset.l].q=Math.max(1,parseInt(t.value,10)||1);renderWa();}}
  else if(act==='wan'){var g3=ui.wa.groups[+t.dataset.g];if(g3)g3.name=t.value.trim();}
});
document.addEventListener('paste',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='watext'){setTimeout(function(){if(!ui.wa)return;ui.wa.text=t.value;var r=parseWa(t.value);ui.wa.groups=r.groups;ui.wa.bad=r.bad;renderWa();},0);return;}
  if(t.dataset&&t.dataset.act==='pasteimg'){
    e.preventDefault();
    var items=(e.clipboardData&&e.clipboardData.items)||[],f=null,i;
    for(i=0;i<items.length;i++){if(items[i].type&&items[i].type.indexOf('image')===0){f=items[i].getAsFile();break;}}
    if(!f){toast('Tidak ada foto yang disalin. Salin foto dari galeri dulu.');return;}
    var pid=t.dataset.id;
    resizeFile(f,1080,'image/jpeg',function(u){addPhoto(pid,u);});
  }
});
render();
startPhotoStore();
})();
</script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
